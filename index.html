// ============================================================
// COSTANTI — DUE OBIETTIVI

const MARATHON_DATE = new Date('2026-11-29T08:30:00');
const RACE_DATE = new Date('2027-05-22T08:00:00');

// Piano a fasi (lunedì di inizio)
const PLAN_START = new Date('2026-08-24T00:00:00'); // lunedì 24 ago 2026

// Fasi del piano — struttura a due obiettivi
const PHASES = [{
  id: 'maratona',
  label: 'Maratona',
  weeks: 14,
  color: '#5A7A9A',
  goal: 'Sub 3:15 Firenze'
}, {
  id: 'recupero',
  label: 'Recupero',
  weeks: 3,
  color: '#7A8B7F',
  goal: 'Recupero post-maratona'
}, {
  id: 'transizione',
  label: 'Transizione',
  weeks: 4,
  color: '#C97D4A',
  goal: 'Ricostruzione ultra + dislivello'
}, {
  id: 'specifico',
  label: 'Specifico',
  weeks: 15,
  color: '#A8453A',
  goal: 'Lunghe ultra + back-to-back'
}, {
  id: 'taper',
  label: 'Taper',
  weeks: 3,
  color: '#3D5A6C',
  goal: 'Scarico verso il Passatore'
}];
const TOTAL_WEEKS = PHASES.reduce((s, p) => s + p.weeks, 0); // 39

function getPhaseForWeek(weekNum) {
  let acc = 0;
  for (const p of PHASES) {
    if (weekNum <= acc + p.weeks) return {
      ...p,
      weekInBlock: weekNum - acc
    };
    acc += p.weeks;
  }
  return {
    ...PHASES[PHASES.length - 1],
    weekInBlock: PHASES[PHASES.length - 1].weeks
  };
}
function weekStartDate(weekNum) {
  const d = new Date(PLAN_START);
  d.setDate(d.getDate() + (weekNum - 1) * 7);
  return d;
}
function isoDate(d) {
  return d.toISOString().slice(0, 10);
}
function fmtDate(d) {
  return d.toLocaleDateString('it-IT', {
    weekday: 'short',
    day: 'numeric',
    month: 'short'
  });
}
function weekNumFromDate(d) {
  const diff = Math.floor((d - PLAN_START) / (1000 * 60 * 60 * 24));
  return Math.max(1, Math.floor(diff / 7) + 1);
}

// ============================================================
// GENERAZIONE VOLUME SETTIMANALE
// ============================================================
function baseWeeklyKm(weekNum, level) {
  const ph = getPhaseForWeek(weekNum);
  const t = (ph.weekInBlock - 1) / Math.max(ph.weeks - 1, 1);
  const isRec = ph.weekInBlock % 4 === 0 && !['recupero', 'taper'].includes(ph.id);
  const ranges = {
    maratona: [45, 56],
    recupero: [20, 30],
    transizione: [38, 50],
    specifico: [52, 82],
    taper: [82, 28]
  };
  const [from, to] = ranges[ph.id];
  let km = from + (to - from) * t;
  if (isRec) km *= 0.72;
  return Math.round(km * level);
}

// ============================================================
// GENERAZIONE SESSIONI SETTIMANALI
// ============================================================
// Schema giorni fisso (non tocca Muay Thai lun/mer/ven):
// Mar(1) + Gio(3) = corsa doppia con forza a pranzo | Sab(5) = lunga | Dom(6) = B2B solo Specifico
function generateRunSessions(weekNum, totalKm) {
  const ph = getPhaseForWeek(weekNum);
  const t = (ph.weekInBlock - 1) / Math.max(ph.weeks - 1, 1);
  const isRec = ph.weekInBlock % 4 === 0 && !['recupero', 'taper'].includes(ph.id);

      type: 'medio',
      label: 'Fondo lento rigenerativo',
      km: Math.round(totalKm * 0.45),

    });

      day: 5,
      type: 'medio',
      label: 'Fondo lento',
      km: Math.round(totalKm * 0.55),
      note: 'Ancora tutto lento. Se senti dolori muscolari profondi, cammina invece di correre.'
    });
  } else if (ph.id === 'maratona') {

    const longKm = Math.min(35, Math.round(totalKm * longPct));
    const rem = totalKm - longKm;

    sessions.push({
      day: 1,
      type: 'qualita',
      label: isRec ? 'Fondo lento' : isQuality ? 'Ripetute (es. 5×1km a 4:20/km)' : 'Progressivo',
      km: Math.round(rem * 0.38),
      note: isRec ? 'Scarico.' : isQuality ? 'Riscaldamento 2km, ripetute a passo gara-10s, recupero 90s, defaticamento.' : 'Parti lento, chiudi gli ultimi 3km a passo gara (4:37/km).' + doppio
    });
    sessions.push({
      day: 3,
      type: 'medio',
      label: isRec ? 'Fondo lento' : 'Fondo medio (passo 5:00-5:15/km)',
      km: Math.round(rem * 0.62),
      note: isRec ? 'Scarico.' : 'Sforzo controllato, non stressante. Costruisce il volume senza affaticare.' + doppio
    });
    sessions.push({
      day: 5,
      type: 'lunga',
      label: isRec ? 'Lunga scarico' : 'Lunga maratona',
      km: longKm,
      note: isRec ? 'Tutto lento, niente ritmo.' : longKm >= 28 ? 'Ultimi 8-10km a passo gara (4:37/km) — simula la fatica finale della maratona.' : 'Fondo lento, costruzione resistenza aerobica.'
    });
  } else if (ph.id === 'transizione') {
    // Ricostruzione logica ultra: aumenta volume, introduce dislivello
    const longPct = 0.40 + 0.06 * t;
    const longKm = Math.round(totalKm * longPct);
    const rem = totalKm - longKm;
    sessions.push({
      day: 1,
      type: 'qualita',
      label: isRec ? 'Fondo lento' : 'Fondo medio + salite (primo dislivello)',
      km: Math.round(rem * 0.40),
      note: 'Inizia a cercare strade con salita vera. Non serve montagna: bastano le colline intorno a Prato/Firenze.' + doppio
    });
    sessions.push({
      day: 3,
      type: 'medio',
      label: 'Fondo medio',
      km: Math.round(rem * 0.60),
      note: 'Volume ultra: ritmo easy, mai sotto 5:30/km. L\'obiettivo è il tempo in piedi, non il passo.' + doppio
    });
    sessions.push({
      day: 5,
      type: 'lunga',
      label: 'Lunga transizione',
      km: longKm,
      note: 'Prima lunga con logica ultra: porta lo zaino, prova alimentazione in corsa, terreno misto se possibile.'
    });
  } else if (ph.id === 'specifico') {
    const useB2B = !isRec && ph.weekInBlock >= 4;
    const pctLong = isRec ? 0.52 : Math.min(0.65, 0.50 + 0.15 * t);
    const pctB2b = useB2B ? 0.12 + 0.05 * t : 0;
    const restPct = 1 - pctLong - pctB2b;
    const mar = Math.round(totalKm * restPct * 0.42);
    const gio = Math.round(totalKm * restPct * 0.58);
    const longSab = Math.round(totalKm * pctLong);
    const b2bDom = useB2B ? Math.round(totalKm * pctB2b) : 0;
    sessions.push({
      day: 1,
      type: 'qualita',
      label: isRec ? 'Fondo lento' : 'Salite / cambi ritmo su trail',
      km: mar,
      note: isRec ? 'Scarico, FC bassa.' : 'Porta scarpe trail, cerca dislivello vero. Simula i tratti tecnici del Passatore.' + doppio
    });
    sessions.push({
      day: 3,
      type: 'medio',
      label: 'Fondo medio + zaino',
      km: gio,
      note: 'Porta lo zaino e le scarpe gara. Prova alimentazione e idratazione esattamente come faresti in gara.' + doppio
    });
    sessions.push({
      day: 5,
      type: 'lunga',
      label: 'Lunga specifica ultra',
      km: longSab,
      note: useB2B && longSab >= 40 ? 'Vera lunga da ultra. Gestisci cibo, idratazione, ritmo come in gara. Se possibile, esci di notte per simulare le ore buie del Passatore.' : 'Lunga progressiva, costruzione resistenza.'
    });
    if (b2bDom > 0) sessions.push({
      day: 6,
      type: 'lunga',
      label: 'Back-to-back (gambe stanche)',
      km: b2bDom,
      note: 'Corsa il giorno dopo la lunga, sulle gambe già affaticate. Simula le ore finali del Passatore.'
    });
  } else {
    // taper
    const longKm = Math.round(totalKm * 0.48);
    const rem = totalKm - longKm;
    sessions.push({
      day: 3,
      type: 'medio',
      label: 'Medio scarico',
      km: Math.round(rem * 0.55),
      note: 'Ritmo facile, gambe sciolte. Niente sforzo.' + doppio
    });
    sessions.push({
      day: 5,
      type: 'lunga',
      label: ph.weekInBlock >= 3 ? 'Ultimo allungo leggero' : 'Lunga scarico',
      km: longKm,
      note: 'Tutto facile. Stai accumulando riposo, non fitness.'
    });
  }

}
function generateWeekPlan(weekNum, level) {
  const ph = getPhaseForWeek(weekNum);
  const totalKm = baseWeeklyKm(weekNum, level);
  const runs = generateRunSessions(weekNum, totalKm);
  const start = weekStartDate(weekNum);
  const isRec = ph.weekInBlock % 4 === 0 && !['recupero', 'taper'].includes(ph.id);
  const sessions = [];
  // Muay Thai fissi lun/mer/ven — saltati settimana 1 (24-30 ago, pausa MT) e durante recupero
  const skipMT = ph.id === 'recupero' || weekNum === 1;
  if (!skipMT) {
    [0, 2, 4].forEach(d => sessions.push({
      day: d,
      type: 'muaythai',
      label: 'Muay Thai',
      fixed: true
    }));
    [1, 3].forEach(d => sessions.push({
      day: d,
      type: 'forza',
      label: 'Forza funzionale (pranzo)',
      fixed: true
    }));
  } else if (weekNum === 1) {
    // Settimana 1: niente MT, forza resta
    [1, 3].forEach(d => sessions.push({
      day: d,
      type: 'forza',
      label: 'Forza funzionale (pranzo)',
      fixed: true
    }));
  } else {
    // recupero: solo mobilità/stretching facoltativo
    sessions.push({
      day: 1,
      type: 'forza',
      label: 'Mobilità / stretching (facoltativo)',
      fixed: true
    });
    sessions.push({
      day: 3,
      type: 'forza',
      label: 'Mobilità / stretching (facoltativo)',
      fixed: true
    });
  }
  runs.forEach(r => sessions.push(r));
  sessions.sort((a, b) => a.day - b.day);
  sessions.forEach(s => {
    const d = new Date(start);
    d.setDate(d.getDate() + s.day);
    s.date = isoDate(d);
    s.id = `w${weekNum}-d${s.day}-${s.type}`;
  });
  return {
    weekNum,
    phase: ph.id,
    phaseLabel: ph.label,
    weekInBlock: ph.weekInBlock,
    blockTotalWeeks: ph.weeks,
    phaseColor: ph.color,
    phaseGoal: ph.goal,
    isRecovery: isRec,
    totalKm,
    sessions,
    startDate: isoDate(start)
  };
}

// ============================================================
// MOTORE ADATTIVO
// ============================================================
function computeAdaptiveLevel(history, currentWeekNum) {
  const lookback = 4;
  const fromWeek = Math.max(1, currentWeekNum - lookback);
  let planned = 0,
    done = 0;
  for (let w = fromWeek; w < currentWeekNum; w++) {
    const plan = generateWeekPlan(w, history.levelAtWeek?.[w] ?? history.currentLevel ?? 1);
    plan.sessions.filter(s => !['muaythai', 'forza'].includes(s.type)).forEach(s => {
      planned++;
      if (history.log[s.id] === 'done') done++;
    });
  }
  if (planned === 0) return {
    level: 1,
    rate: 1,
    status: 'ok',
    weeksConsidered: 0
  };
  const rate = done / planned;
  let level = history.currentLevel ?? 1;
  let status = 'ok';
  if (rate >= 0.85) {
    level = Math.min(1, level + 0.05);
    status = 'ok';
  } else if (rate >= 0.6) {
    status = 'frozen';
  } else {
    level = Math.max(0.55, level - 0.12);
    status = 'reduced';
  }
  return {
    level,
    rate,
    status,
    weeksConsidered: currentWeekNum - fromWeek
  };
}
