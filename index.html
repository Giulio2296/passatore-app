const TOTAL_WEEKS = PHASES.reduce((s, p) => s + p.weeks, 0);
function weekStartDate(w) {
  return new Date(PLAN_START.getTime() + (w - 1) * 7 * 86400000);
}
function fmtDate(d) {
  return d.toLocaleDateString('it-IT', {
    weekday: 'short',
    day: 'numeric',
    month: 'short'
  });
}
function weekNumFromDate(d) {
  return Math.max(1, Math.floor((d.getTime() - PLAN_START.getTime()) / (7 * 86400000)) + 1);
}
function getPhaseForWeek(w) {
  let acc = 0;
  for (const p of PHASES) {
    if (w <= acc + p.weeks) return {
      ...p,
      weekInBlock: w - acc

    acc += p.weeks;
  }
  return {
    ...PHASES[PHASES.length - 1],
    weekInBlock: PHASES[PHASES.length - 1].weeks
  };
}
function baseWeeklyKm(w, level) {
  const ph = getPhaseForWeek(w);
  const t = (ph.weekInBlock - 1) / Math.max(ph.weeks - 1, 1);
  const isRec = ph.weekInBlock % 4 === 0 && !['taper', 'gara'].includes(ph.id);
  const ranges = {
    maratona: [45, 60],
    transizione: [30, 45],
    specifico: [52, 82],
    taper: [70, 22],
    gara: [15, 15]

  if (ph.id === 'gara') return 15;
  const [from, to] = ranges[ph.id];
  let km = from + (to - from) * t;
  if (isRec) km *= 0.72;
  return Math.round(km * level);
}
const MOB_NOTE = 'Contenuto da definire con fisio o preparatore — non seguire routine generiche finché la schiena non è stata valutata.';

// ─── BLOCCO SPECIFICO MARATONA · settimane 11-17 (2 nov → 20 dic 2026) ───
// Obiettivo: sub 3:00 = 4:16/km. Il limite rilevato non è cardiaco (Roma: FC media

const PG = '4:16/km';

function medio(km, passo, fcMin, fcMax, doppio, extra = '') {

    label: `Medio ${km} km a ${passo}`,

}
function z2gio(km, doppio) {

}
function rigen(km) {

}
function lunga(km, z2km, pgKm, passo, fcMax, label) {

    label: label ?? `Lunga ${km} km (${z2km} Z2 + ${pgKm} a ${passo})`,

}
function bloccoSpecifico(w, doppio) {

        label: 'Z2 13 km — già svolto 3 nov',

        label: 'Rifinitura 8 km con 3×1 km',

        day: 3,
        type: 'medio',

      }, {
        day: 5,
        type: 'medio',
        label: 'Sgambata 4 km',
        km: 4,

        day: 6,
        type: 'lunga',
        label: '🏁 MARATONA DI FIRENZE',

function generateRunSessions(w, totalKm) {

      });

        type: 'lunga',

      s.push({
        day: 3,
        type: 'medio',
        label: 'Fondo lento',
        km: 8,
        note: noteZ2puro()
      });
      s.push({
        day: 5,

      });

    }
    const longKmPlan = [0, 22, 25, 27, 18, 28, 30, 32, 20, 33, 35, 34, 22, 18, 14, 10, 0];
    const longKm = longKmPlan[ph.weekInBlock] ?? 20;
    if (isTaper || isRec4) {
      const marKm = isTaper ? 6 : 8,
        gioKm = isTaper ? 8 : 10;
      s.push({
        day: 1,
        type: 'qualita',
        label: 'Fondo lento',
        km: marKm,
        note: noteZ2puro(' Scarico.')
      });
      s.push({
        day: 3,
        type: 'medio',
        label: 'Fondo lento',
        km: gioKm,
        note: noteZ2puro(' Scarico.')
      });

        type: 'lunga',
        label: isTaper ? 'Lunga taper' : 'Lunga scarico',

      });
    } else {
      const marKm = Math.min(12, Math.round(longKm * 0.30));
      const gioKm = Math.min(14, Math.round(longKm * 0.38));

      const qc = {
        ripetute: {
          label: `Ripetute ${nRip}×1km`,
          note: `${FC_LABELS.Z5a} nelle ripetute, Z2 nel recupero. Schema: 2km riscaldamento Z2 → ${nRip}×1km a 170-175 bpm (~3:50-4:00/km) con 90s recupero camminando → 2km defaticamento Z2. Non partire forte nelle prime ripetute.${doppio}`
        },
        progressivo: {
          label: 'Progressivo',
          note: `${FC_LABELS.Z2} i primi 2/3, ${FC_LABELS.Z4} l'ultimo terzo. Parti a 5:20/km (≤145 bpm), chiudi gli ultimi 3km a 4:16/km (165-170 bpm).${doppio}`
        },
        fartlek: {
          label: 'Fartlek 6×3 min',

        },
        salite: {
          label: 'Salite 8×45"',
          note: `Schema: 2km riscaldamento Z2 → 8×45 secondi in salita ripida (5-8%) a sforzo quasi massimo, recupero camminando in discesa → 2km defaticamento Z2. Guarda lo sforzo, non il passo.${doppio}`
        }
      }[qt];
      s.push({
        day: 1,
        type: 'qualita',
        label: qc.label,
        km: marKm,
        note: qc.note
      });
      s.push({
        day: 3,
        type: 'medio',
        label: 'Z2 puro — fondo lento',
        km: gioKm,
        note: `${FC_LABELS.Z2} — MAX 151 bpm. Giovedì è recupero aerobico: se vai sopra 151 bpm stai in Z3 e sprechi la sessione.${doppio}`
      });
      s.push({
        day: 5,
        type: 'lunga',
        label: z4km > 0 ? `Lunga con finale Z4 (${z2km}+${z4km}km)` : 'Lunga Z2',
        km: longKm,
        note: z4km > 0 ? noteLunga(z2km, z4km) : `${FC_LABELS.Z2} — max 151 bpm per tutta la durata.`
      });
      s.push({
        day: 6,
        type: 'rigenerativa',
        label: 'Rigenerativa 35 min + allunghi',
        km: 6,
        note: `🔵 Z1-Z2 basso — MAX 140 bpm per 30 minuti, passo ~5:40-6:00/km. Poi 6×20 secondi in salita breve a sforzo brillante, recupero camminando. Se le gambe sono dure dalla lunga, salta gli allunghi.`
      });
    }

  }
  if (ph.id === 'transizione') {
    const marKm = Math.min(12, Math.round(totalKm * 0.22));
    const gioKm = Math.min(14, Math.round(totalKm * 0.27));
    const longKm = totalKm - marKm - gioKm;
    s.push({
      day: 1,
      type: 'qualita',
      label: 'Fondo medio + salite',
      km: marKm,
      note: `${FC_LABELS.Z3} — introduce dislivello. FC 151-160 bpm, più alto sulle salite. Cerca colline intorno a Prato/Firenze.${doppio}`
    });
    s.push({
      day: 3,
      type: 'medio',
      label: 'Z2 puro',
      km: gioKm,
      note: noteZ2puro()
    });
    s.push({
      day: 5,
      type: 'lunga',
      label: 'Lunga transizione',
      km: longKm,
      note: `${FC_LABELS.Z2} — prima lunga con logica ultra. Porta zaino, prova alimentazione, terreno misto. Max 151 bpm.`
    });
    s.push({
      day: 6,
      type: 'rigenerativa',
      label: 'Rigenerativa 35 min',
      km: 6,
      note: `🔵 Z1-Z2 basso — MAX 140 bpm. Recupero attivo dalla lunga di ieri.`
    });
    return s;
  }
  if (ph.id === 'specifico') {
    const useB2B = !isRec && ph.weekInBlock >= 4;
    const pctLong = isRec ? 0.55 : Math.min(0.68, 0.52 + 0.16 * t);
    const pctB2b = useB2B ? 0.12 + 0.05 * t : 0;
    const marKm = isRec ? 7 : Math.min(11, Math.round(totalKm * 0.13));
    const gioKm = isRec ? 9 : Math.min(13, Math.round(totalKm * 0.16));
    const longSab = Math.round((totalKm - marKm - gioKm) * (pctLong / (pctLong + (pctB2b || 0.001))));
    const b2bDom = useB2B ? totalKm - marKm - gioKm - longSab : 0;
    s.push({
      day: 1,
      type: 'qualita',
      label: isRec ? 'Fondo lento' : ph.weekInBlock % 2 === 1 ? 'Salite lunghe 5×3 min' : 'Fartlek trail 8×2 min',
      km: marKm,
      note: isRec ? noteZ2puro(' Scarico.') : ph.weekInBlock % 2 === 1 ? `Schema: 2km riscaldamento Z2 → 5×3 min in salita costante a ${FC_LABELS.Z4} (160-170 bpm), recupero in discesa lento → defaticamento. Salita di 600-800m. Impara a salire senza sforare soglia.${doppio}` : `Schema: 2km riscaldamento Z2 → 8×2 min a ritmo brillante su terreno misto, recupero 2 min Z2 → defaticamento. Porta scarpe trail.${doppio}`
    });

  const marKm = Math.min(8, Math.round(longKm * 0.20));

  s.push({

  });
  s.push({
    day: 5,
    type: 'lunga',
    label: ph.weekInBlock <= 2 ? 'Lunga taper' : 'Allungo leggero',

function generateWeekPlan(w, level) {
  const ph = getPhaseForWeek(w);
  const totalKm = baseWeeklyKm(w, level);
  const runs = generateRunSessions(w, totalKm);
  const start = weekStartDate(w);
  const inSpecifico = ph.id === 'maratona' && ph.weekInBlock >= 11;
  const isRec = inSpecifico ? ph.weekInBlock === 16 : ph.weekInBlock % 4 === 0 && !['taper', 'gara'].includes(ph.id);
  const skipMT = w === 1 || ph.id === 'gara';
  const mtRidotto = ph.id === 'maratona' && ph.weekInBlock >= 14;
  const mtSoloLun = ph.id === 'maratona' && ph.weekInBlock === 17;
  const sessions = [];
  if (!skipMT) {
    (mtSoloLun ? [0] : mtRidotto ? [0, 2] : [0, 2, 4]).forEach(d => sessions.push({
      day: d,
      type: 'muaythai',
      label: 'Muay Thai',
      note: mtSoloLun ? 'Ore 21:00 · ultima seduta prima della gara. Niente sparring, niente contatto duro.' : mtRidotto ? 'Ore 21:00 · taper pre-maratona (venerdì saltato)' : 'Ore 21:00',
      fixed: true
    }));

      day: d,
      type: 'forza',
      label: 'Forza funzionale',
      note: 'Pausa pranzo',
      fixed: true
    }));
