const MARATHON_DATE = new Date('2026-11-29T08:30:00');
const RACE_DATE = new Date('2027-05-22T08:00:00');

// Tutte le funzioni date usano mezzogiorno locale (T12:00:00) per evitare
// il bug classico UTC+2: new Date("YYYY-MM-DD") = mezzanotte UTC = 22:00 del giorno
// prima in Italia, causando date sbagliate di un giorno.
const PLAN_START = new Date('2026-08-24T12:00:00'); // lunedì 24 ago 2026, mezzogiorno

function weekStartDate(weekNum) {
  const ms = PLAN_START.getTime() + (weekNum - 1) * 7 * 86400000;
  return new Date(ms);
}
function isoDate(d) {
  // usa i campi locali, non UTC, per evitare shift di fuso orario
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

  return d.toLocaleDateString('it-IT', {

    day: 'numeric',
    month: 'short'
  });
}
function weekNumFromDate(d) {
  const diffMs = d.getTime() - PLAN_START.getTime();
  const diffDays = Math.floor(diffMs / 86400000);
  return Math.max(1, Math.floor(diffDays / 7) + 1);
}
const PHASES = [{
  id: 'maratona',
  label: 'Maratona',
  weeks: 14,
  color: '#5A7A9A',
  goal: 'Sub 3:15 Firenze'
}, {
  id: 'transizione',

  weeks: 4,
  color: '#C97D4A',

}, {
  id: 'specifico',
  label: 'Specifico',
  weeks: 15,
  color: '#A8453A',
  goal: 'Lunghe ultra + back-to-back'
}, {
  id: 'taper',
  label: 'Taper',
  weeks: 5,
  color: '#3D5A6C',
  goal: 'Scarico verso il Passatore'
}, {
  id: 'gara',
  label: 'Gara',
  weeks: 1,
  color: '#1A1A1A',
  goal: '100km del Passatore — 22 maggio 2027'
}];
const TOTAL_WEEKS = PHASES.reduce((s, p) => s + p.weeks, 0); // 39

function getPhaseForWeek(weekNum) {
  let acc = 0;
  for (const p of PHASES) {
    if (weekNum <= acc + p.weeks) return {
      ...p,
      weekInBlock: weekNum - acc
    };
    acc += p.weeks;
  }
  return {
    ...PHASES[PHASES.length - 1],
    weekInBlock: PHASES[PHASES.length - 1].weeks
  };
}

// ============================================================
// GENERAZIONE VOLUME SETTIMANALE
// ============================================================
function baseWeeklyKm(weekNum, level) {
  const ph = getPhaseForWeek(weekNum);
  const t = (ph.weekInBlock - 1) / Math.max(ph.weeks - 1, 1);
  const isRec = ph.weekInBlock % 4 === 0 && !['taper', 'gara'].includes(ph.id);
  const ranges = {
    maratona: [45, 56],
    transizione: [30, 45],
    // volume ridotto post-maratona ma attivo (non recupero passivo)
    specifico: [52, 82],
    taper: [70, 22],
    // scarico più lungo: 5 sett da 70 a 22km
    gara: [15, 15] // settimana gara: solo scioglimento + 100km sabato
  };
  const [from, to] = ranges[ph.id] ?? [40, 40];
  let km = from + (to - from) * t;
  if (isRec) km *= 0.72;
  if (ph.id === 'gara') return 15; // fisso
  return Math.round(km * level);
}

// ============================================================
// GENERAZIONE SESSIONI SETTIMANALI
// ============================================================
// Schema giorni fisso (non tocca Muay Thai lun/mer/ven):
// Mar(1) = qualità/breve (max ~12km) | Gio(3) = medio/breve (max ~14km) | Sab(5) = lunga
// Dom(6) = back-to-back solo Specifico (settimane piene)
// Infrasettimanali volutamente corti per chi ha poco tempo nei giorni lavorativi.
function generateRunSessions(weekNum, totalKm) {
  const ph = getPhaseForWeek(weekNum);
  const t = (ph.weekInBlock - 1) / Math.max(ph.weeks - 1, 1);
  const isRec = ph.weekInBlock % 4 === 0 && !['taper', 'gara'].includes(ph.id);
  const sessions = [];

  if (ph.id === 'gara') {
    // Settimana del Passatore: scioglimento giovedì, riposo venerdì, GARA sabato
    sessions.push({
      day: 3,
      type: 'medio',
      label: 'Scioglimento gambe',
      km: 8,
      note: 'Corsa leggerissima, solo per sciogliere. Niente sforzo.' + doppio
    });
    sessions.push({
      day: 5,
      type: 'lunga',
      label: '🏁 100KM DEL PASSATORE',
      km: 100,
      note: 'Partenza sabato 22 maggio ore 15:00 da Firenze, Piazza del Duomo. Arrivo Faenza.'
    });
    return sessions;
  } else if (ph.id === 'maratona') {
    const isTaper = ph.weekInBlock >= 11;
    const isRec4 = ph.weekInBlock % 4 === 0;

    // Settimana 14: ultima settimana prima della gara (domenica 29 nov) — 3 sessioni a tempo fisso
    if (ph.weekInBlock === 14) {
      sessions.push({
        day: 6,
        type: 'lunga',
        label: '🏁 MARATONA DI FIRENZE',
        km: 42,
        note: 'Gara. Partenza domenica 29 novembre. Sabato: riposo totale, solo idratazione e pasto leggero la sera.'
      });
      sessions.push({
        day: 1,
        type: 'qualita',
        label: 'Scioglimento 50 min',
        km: 9,
        note: 'Corri 50 minuti a ritmo molto facile. Ultimi 5 min a passo gara solo per sentire le gambe. Niente sforzo.' + doppio
      });
      sessions.push({
        day: 3,
        type: 'medio',
        label: 'Scioglimento 40 min',
        km: 7,
        note: 'Corri 40 minuti lento. Gambe sciolte, niente qualità.' + doppio
      });
      sessions.push({
        day: 5,
        type: 'lunga',
        label: 'Scioglimento 30 min',
        km: 5,
        note: 'Corri 30 minuti lentissimo. Sabato riposo totale.'
      });
      return sessions;
    }

    // Progressione lunga pianificata settimana per settimana:
    // S1:23 S2:26 S3:28 S4:18(sc) S5:28 S6:30 S7:32 S8:20(sc) S9:34 S10:35 S11:22(tap) S12:14(tap) S13:10(tap)
    const longKmPlan = [0, 23, 26, 28, 18, 28, 30, 32, 20, 34, 35, 22, 14, 10];
    const longKm = longKmPlan[ph.weekInBlock] ?? 20;
    const isQuality = !isRec4 && !isTaper && ph.weekInBlock % 2 !== 0;
    if (isTaper || isRec4) {
      // Taper o scarico: infrasettimanali ridotti, lunga corta
      const marKm = isTaper ? 6 : 8;
      const gioKm = isTaper ? 8 : 10;
      sessions.push({
        day: 1,
        type: 'qualita',
        label: 'Fondo lento',
        km: marKm,
        note: isTaper ? 'Taper: tutto lento, gambe fresche per la gara.' : 'Scarico. Ritmo conversazionale.' + doppio
      });
      sessions.push({
        day: 3,
        type: 'medio',
        label: 'Fondo lento',
        km: gioKm,
        note: isTaper ? 'Taper: ultimo corto prima della gara. Niente sforzo.' : 'Scarico.' + doppio
      });
      sessions.push({
        day: 5,
        type: 'lunga',
        label: isTaper ? 'Lunga taper' : 'Lunga scarico',
        km: longKm,
        note: isTaper ? 'Corta e lenta. Obiettivo: sciogliere le gambe, non stancarle.' : 'Tutto lento, niente ritmo.'
      });
    } else {
      // Settimane di costruzione: infrasettimanali corti, lunga progressiva al sabato
      const marKm = Math.min(12, Math.round(longKm * 0.30));
      const gioKm = Math.min(14, Math.round(longKm * 0.38));
      sessions.push({
        day: 1,
        type: 'qualita',
        label: isQuality ? 'Ripetute (es. 5×1km a 4:20/km)' : 'Progressivo',
        km: marKm,
        note: isQuality ? 'Riscaldamento 2km, 5×1km a 4:27/km, recupero 90s camminando, defaticamento 2km.' : 'Parti a 5:30/km, chiudi gli ultimi 2km a passo gara (4:37/km).' + doppio
      });
      sessions.push({
        day: 3,
        type: 'medio',
        label: 'Fondo medio',
        km: gioKm,
        note: 'Passo 5:00-5:15/km, sforzo controllato. Corto ma qualitativo.' + doppio
      });
      sessions.push({
        day: 5,
        type: 'lunga',
        label: longKm >= 30 ? 'Lunga picco maratona' : 'Lunga maratona',
        km: longKm,
        note: longKm >= 30 ? 'Ultimi 8-10km a passo gara (4:37/km) — questo è il lavoro che fa la differenza per sub 3:15.' : longKm >= 25 ? 'Ultimi 5km a passo gara. Costruisci la resistenza aerobica.' : 'Fondo lento, costruzione base.'
      });
    }

    const marKm = isRec ? 8 : Math.min(12, Math.round(totalKm * 0.22));
    const gioKm = isRec ? 10 : Math.min(14, Math.round(totalKm * 0.27));
    const longKm = totalKm - marKm - gioKm;
    sessions.push({
      day: 1,
      type: 'qualita',
      label: isRec ? 'Fondo lento' : 'Fondo medio + salite',
      km: marKm,
      note: 'Cerca strade con salita vera — colline intorno a Prato/Firenze vanno benissimo. Primo dislivello vero.' + doppio
    });
    sessions.push({
      day: 3,
      type: 'medio',
      label: 'Fondo medio',
      km: gioKm,
      note: 'Passo easy, mai sotto 5:30/km. Obiettivo: tempo in piedi, non velocità.' + doppio
    });
    sessions.push({
      day: 5,
      type: 'lunga',
      label: 'Lunga transizione',
      km: longKm,
      note: 'Prima lunga con logica ultra: porta lo zaino, prova alimentazione in corsa, terreno misto se possibile.'
    });
  } else if (ph.id === 'specifico') {
    const useB2B = !isRec && ph.weekInBlock >= 4;
    const pctLong = isRec ? 0.55 : Math.min(0.68, 0.52 + 0.16 * t);
    const pctB2b = useB2B ? 0.12 + 0.05 * t : 0;
    // infrasettimanali fissi e corti anche nello specifico
    const marKm = isRec ? 7 : Math.min(11, Math.round(totalKm * 0.13));
    const gioKm = isRec ? 9 : Math.min(13, Math.round(totalKm * 0.16));
    const longSab = Math.round((totalKm - marKm - gioKm) * (pctLong / (pctLong + pctB2b)));
    const b2bDom = useB2B ? totalKm - marKm - gioKm - longSab : 0;
    sessions.push({
      day: 1,
      type: 'qualita',
      label: isRec ? 'Fondo lento' : 'Salite / cambi ritmo su trail',
      km: marKm,
      note: isRec ? 'Scarico, FC bassa.' : 'Breve ma specifico: porta scarpe trail, cerca dislivello. Simula i tratti tecnici del Passatore.' + doppio
    });
    sessions.push({
      day: 3,
      type: 'medio',
      label: 'Fondo medio + zaino',
      km: gioKm,
      note: 'Porta lo zaino e le scarpe gara. Prova alimentazione e idratazione come faresti in gara.' + doppio
    });
    sessions.push({
      day: 5,
      type: 'lunga',
      label: 'Lunga specifica ultra',
      km: longSab,
      note: useB2B && longSab >= 40 ? 'Vera lunga da ultra. Gestisci cibo, idratazione, ritmo come in gara. Se possibile, esci al tramonto per abituarti al buio.' : 'Lunga progressiva, costruzione resistenza.'
    });
    if (b2bDom > 0) sessions.push({
      day: 6,
      type: 'lunga',
      label: 'Back-to-back (gambe stanche)',
      km: b2bDom,
      note: 'Corsa il giorno dopo la lunga, sulle gambe già affaticate. Simula le ore finali del Passatore.'
    });
  } else {
    // taper (5 settimane)
    // Progressione scarico: lunga scende da ~35km a ~10km, infrasettimanali sempre corti
    // wib 1: lunga 32km | wib 2: 26km | wib 3: 20km | wib 4: 14km | wib 5: 8km
    const longKmTaper = [0, 32, 26, 20, 14, 8];
    const longKm = longKmTaper[ph.weekInBlock] ?? 10;
    const gioKm = Math.min(10, Math.round(longKm * 0.28));
    const marKm = Math.min(8, Math.round(longKm * 0.20));
    sessions.push({
      day: 1,
      type: 'qualita',
      label: 'Fondo lento',
      km: marKm,
      note: 'Taper: tutto facile. Stai accumulando riposo, non fitness.' + doppio

    sessions.push({
      day: 3,
      type: 'medio',
      label: 'Medio scarico',

function generateWeekPlan(weekNum, level) {
  const ph = getPhaseForWeek(weekNum);
  const totalKm = baseWeeklyKm(weekNum, level);
  const runs = generateRunSessions(weekNum, totalKm);
  const start = weekStartDate(weekNum);
  const isRec = ph.weekInBlock % 4 === 0 && !['taper', 'gara'].includes(ph.id);
  const sessions = [];
  // Muay Thai lun/mer/ven ore 21 — saltato settimana 1 (niente MT) e settimana gara
  const skipMT = weekNum === 1 || ph.id === 'gara';
  if (!skipMT) {
    [0, 2, 4].forEach(d => sessions.push({
      day: d,
      type: 'muaythai',
      label: 'Muay Thai',
      note: 'Ore 21:00',
      fixed: true
    }));
    [1, 3].forEach(d => sessions.push({
      day: d,
      type: 'forza',
      label: 'Forza funzionale',
      note: 'Pausa pranzo',
      fixed: true
    }));
  } else if (weekNum === 1) {
    // Settimana 1: niente MT, forza resta
    [1, 3].forEach(d => sessions.push({
      day: d,
      type: 'forza',
      label: 'Forza funzionale',
      note: 'Pausa pranzo',
      fixed: true
    }));
  }
  // Settimana gara: niente MT né forza — solo scioglimento e GARA

  runs.forEach(r => sessions.push(r));
  sessions.sort((a, b) => a.day - b.day);
  const startMs = start.getTime();
  sessions.forEach(s => {
    const d = new Date(startMs + s.day * 86400000);
    s.date = d;
    s.id = `w${weekNum}-d${s.day}-${s.type}`;
  });

  // totalKm reale = somma dei km di corsa effettivamente generati (non il valore teorico della curva)
  const actualKm = runs.reduce((sum, s) => sum + (s.km ?? 0), 0);
  return {
    weekNum,
    phase: ph.id,
    phaseLabel: ph.label,
    weekInBlock: ph.weekInBlock,
    blockTotalWeeks: ph.weeks,
    phaseColor: ph.color,
    phaseGoal: ph.goal,
    isRecovery: isRec,
    totalKm: actualKm,
    sessions,
    startDate: isoDate(start)
  };
}

function computeAdaptiveLevel(history, currentWeekNum) {
  const lookback = 4;
  const fromWeek = Math.max(1, currentWeekNum - lookback);
  let planned = 0,
    done = 0;
  for (let w = fromWeek; w < currentWeekNum; w++) {
    const plan = generateWeekPlan(w, history.levelAtWeek?.[w] ?? history.currentLevel ?? 1);
    plan.sessions.filter(s => !['muaythai', 'forza'].includes(s.type)).forEach(s => {
      planned++;
      if (history.log[s.id] === 'done') done++;
    });
  }
  if (planned === 0) return {
    level: 1,
    rate: 1,
    status: 'ok',
    weeksConsidered: 0
  };
  const rate = done / planned;
  let level = history.currentLevel ?? 1;
  let status = 'ok';
  if (rate >= 0.85) {
    level = Math.min(1, level + 0.05);
    status = 'ok';
  } else if (rate >= 0.6) {
    status = 'frozen';
  } else {
    level = Math.max(0.55, level - 0.12);
    status = 'reduced';
  }
  return {
    level,
    rate,
    status,
    weeksConsidered: currentWeekNum - fromWeek
  };
}
